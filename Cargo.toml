[package]
name = "vermouth"
version = "0.1.0"
edition = "2024"
authors = ["LucasErrNotFound"]
repository = "https://github.com/LucasErrNotFound/vermouth"
description = "Provisional native IP camera desktop frontend"
readme = "README.md"
license-file = "LICENSE"
publish = false

[dependencies]
gpui-kit = "0.8.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
smallvec = "1.16.4"
if-addrs = "0.15.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
chrono = "0.4.45"
md-5 = "0.11.0"
rand = "0.10.3"
sha1 = "0.11.0"
sha2 = "0.11.1"
zeroize = "1.9.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
