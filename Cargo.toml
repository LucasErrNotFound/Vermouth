[package]
name = "vermouth"
version = "0.1.0"
edition = "2024"
authors = ["LucasErrNotFound"]
repository = "https://github.com/LucasErrNotFound/vermouth"
description = "Provisional native IP camera desktop frontend"
readme = "README.md"
license-file = "LICENSE"
publish = false

[dependencies]
gpui-kit = "0.8.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
smallvec = "1.16.4"
if-addrs = "0.15.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
